<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HYORA STUDY</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#050507;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 4px)}
.wrap{max-width:650px;margin:auto;padding:22px 16px 50px}
h1{margin:5px 0 4px;font-size:30px;letter-spacing:3px;text-shadow:0 0 12px #00f5ff}
.sub{color:#8d929b;margin-bottom:22px}
.card{background:#0d0e12;border:1px solid #252831;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 0 18px #00e5ff12}
.title{font-size:18px;font-weight:700;margin-bottom:12px;color:#7df9ff}
button,input,select{font:inherit}
button{border:1px solid #00e5ff;background:#071317;color:#dffcff;border-radius:11px;padding:9px 12px;margin:4px;cursor:pointer}
button:hover{box-shadow:0 0 12px #00e5ff55}
input,select{width:100%;background:#08090c;color:#fff;border:1px solid #30343d;border-radius:10px;padding:10px;margin:5px 0}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.task{display:flex;gap:10px;align-items:center;border-bottom:1px solid #20232a;padding:10px 0}
.task:last-child{border:0}
.task span{flex:1}
.done{text-decoration:line-through;color:#777}
.bar{height:9px;background:#20232a;border-radius:10px;overflow:hidden}
.bar i{display:block;height:100%;background:#00e5ff;box-shadow:0 0 12px #00e5ff}
.timer{text-align:center;font-size:48px;font-weight:700;text-shadow:0 0 15px #00e5ff;margin:8px}
.empty{color:#777;text-align:center;padding:15px}
</style>
</head>

<body>
<main class="wrap">

<h1>HYORA STUDY</h1>
<div class="sub">MY STUDY SYSTEM</div>

<section class="card">
<div class="title">⏱ STUDY TIMER</div>
<div id="time" class="timer">25:00</div>
<div class="row">
<button onclick="start()">START</button>
<button onclick="pause()">PAUSE</button>
<button onclick="resetTimer()">RESET</button>
</div>
</section>

<section class="card">
<div class="title">📚 SUBJECTS</div>
<div id="subjects"></div>
<div class="row">
<input id="subjectName" placeholder="과목 이름">
<input id="subjectWeight" type="number" min="0" value="25" placeholder="비중 %">
<button onclick="addSubject()">추가</button>
</div>
</section>

<section class="card">
<div class="title">✅ TODAY'S TASKS</div>
<div id="tasks"></div>
<div class="row">
<input id="taskName" placeholder="할 일 추가">
<select id="taskSubject"></select>
<button onclick="addTask()">추가</button>
</div>
<div id="progressText"></div>
<div class="bar"><i id="progress"></i></div>
</section>

</main>

<script>
let data=JSON.parse(localStorage.getItem("hyora-study-v2")||'{"subjects":[],"tasks":[]}');
let sec=1500,timer=null;

const $=id=>document.getElementById(id);

function save(){
localStorage.setItem("hyora-study-v2",JSON.stringify(data));
}

function esc(x){
return String(x).replace(/[&<>"']/g,m=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[m]));
}

function render(){

$("subjects").innerHTML=data.subjects.length
?data.subjects.map((s,i)=>`
<div class="row">
<span>${esc(s.name)}</span>
<input type="number" value="${s.weight}"
onchange="data.subjects[${i}].weight=Number(this.value)||0;save()">
<button onclick="delSubject(${i})">삭제</button>
</div>`).join("")
:'<div class="empty">과목을 직접 추가하세요.</div>';

$("taskSubject").innerHTML=
'<option value="-1">과목 없음</option>'+
data.subjects.map((s,i)=>
`<option value="${i}">${esc(s.name)}</option>`).join("");

$("tasks").innerHTML=data.tasks.length
?data.tasks.map((t,i)=>`
<div class="task">
<input type="checkbox" ${t.done?'checked':''} onchange="toggle(${i})">
<span class="${t.done?'done':''}">
${esc(t.name)}
${t.sub>=0&&data.subjects[t.sub]?' · '+esc(data.subjects[t.sub].name):''}
</span>
<button onclick="delTask(${i})">삭제</button>
</div>`).join("")
:'<div class="empty">할 일을 추가하세요.</div>';

let n=data.tasks.length;
let d=data.tasks.filter(t=>t.done).length;
let p=n?Math.round(d/n*100):0;

$("progress").style.width=p+"%";
$("progressText").textContent=`진행률 ${p}% (${d}/${n})`;
}

function addSubject(){
let n=$("subjectName").value.trim();
let w=Number($("subjectWeight").value)||0;
if(!n)return;

data.subjects.push({name:n,weight:w});
$("subjectName").value="";
save();
render();
}

function delSubject(i){
data.tasks.forEach(t=>{
if(t.sub===i)t.sub=-1;
else if(t.sub>i)t.sub--;
});
data.subjects.splice(i,1);
save();
render();
}

function addTask(){
let n=$("taskName").value.trim();
if(!n)return;

data.tasks.push({
name:n,
done:false,
sub:Number($("taskSubject").value)
});

$("taskName").value="";
save();
render();
}

function toggle(i){
data.tasks[i].done=!data.tasks[i].done;
save();
render();
}

function delTask(i){
data.tasks.splice(i,1);
save();
render();
}

function show(){
let m=Math.floor(sec/60);
let s=sec%60;
$("time").textContent=
`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
}

function start(){
if(timer)return;
timer=setInterval(()=>{
if(sec>0){
sec--;
show();
}else{
pause();
}
},1000);
}

function pause(){
clearInterval(timer);
timer=null;
}

function resetTimer(){
pause();
sec=1500;
show();
}

render();
</script>

</body>
</html>
