<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>HYORA STUDY</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#050505;
  color:#f5f5f5;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Pretendard",sans-serif;
}

button,input,select,textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
}

.app{
  max-width:760px;
  margin:auto;
  padding:20px 16px 100px;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:-1px;
}

.logo span{
  color:#a6ff00;
}

.date{
  color:#777;
  font-size:12px;
}

.card{
  background:#0d0d0d;
  border:1px solid #1d1d1d;
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
}

.card-title{
  font-size:14px;
  font-weight:800;
  margin-bottom:14px;
}

.hero{
  background:
    radial-gradient(circle at 90% 0%,rgba(166,255,0,.13),transparent 40%),
    #0d0d0d;
}

.greeting{
  color:#777;
  font-size:12px;
}

.big-title{
  margin-top:5px;
  font-size:29px;
  font-weight:900;
  letter-spacing:-1.5px;
}

.accent{
  color:#a6ff00;
}

.progress-info{
  display:flex;
  justify-content:space-between;
  margin-top:18px;
  margin-bottom:7px;
  font-size:12px;
  color:#777;
}

.progress-info strong{
  color:#a6ff00;
}

.progress{
  height:8px;
  background:#202020;
  border-radius:99px;
  overflow:hidden;
}

.progress-bar{
  height:100%;
  width:0%;
  background:#a6ff00;
  border-radius:99px;
  transition:width .3s;
}

.tabs{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:5px;
  padding:5px;
  background:#0b0b0b;
  border-radius:14px;
  margin-bottom:14px;
}

.tab{
  background:transparent;
  color:#666;
  padding:10px 2px;
  border-radius:10px;
  font-size:10px;
  font-weight:700;
}

.tab.active{
  background:#191919;
  color:#a6ff00;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.add-row{
  display:flex;
  gap:6px;
  margin-bottom:12px;
}

input,select,textarea{
  background:#151515;
  color:#fff;
  border:1px solid #292929;
  border-radius:11px;
  padding:11px;
  outline:none;
}

input:focus,select:focus,textarea:focus{
  border-color:#a6ff00;
}

.add-row input{
  flex:1;
  min-width:0;
}

.add-btn{
  background:#a6ff00;
  color:#050505;
  border-radius:11px;
  padding:0 15px;
  font-weight:900;
}

.task{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #181818;
}

.task:last-child{
  border-bottom:none;
}

.check{
  width:21px;
  height:21px;
  border:1px solid #444;
  border-radius:6px;
  flex-shrink:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.task.done .check{
  background:#a6ff00;
  border-color:#a6ff00;
  color:#000;
}

.task-main{
  flex:1;
  min-width:0;
}

.task-text{
  font-size:14px;
}

.task.done .task-text{
  color:#555;
  text-decoration:line-through;
}

.task-meta{
  margin-top:3px;
  color:#666;
  font-size:11px;
}

.delete{
  background:none;
  color:#555;
  font-size:18px;
  padding:4px 7px;
}

.empty{
  text-align:center;
  color:#555;
  font-size:13px;
  padding:25px 5px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}

.stat{
  background:#151515;
  border-radius:13px;
  padding:13px 5px;
  text-align:center;
}

.stat strong{
  display:block;
  color:#a6ff00;
  font-size:20px;
}

.stat span{
  color:#666;
  font-size:10px;
}

.exam-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.exam-grid label{
  display:block;
  color:#777;
  font-size:11px;
  margin-bottom:5px;
}

.exam-grid input{
  width:100%;
}

.save-exam{
  width:100%;
  padding:12px;
  margin-top:10px;
}

.subject-row{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:10px;
}

.subject-name{
  width:60px;
  font-size:13px;
}

.subject-row input{
  width:65px;
  text-align:center;
}

.weight-line{
  flex:1;
  height:5px;
  background:#222;
  border-radius:99px;
  overflow:hidden;
}

.weight-line i{
  display:block;
  height:100%;
  background:#a6ff00;
}

.note-form{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.note-form select,
.note-form input,
.note-form textarea{
  width:100%;
}

.note-form textarea{
  min-height:75px;
  resize:vertical;
}

.note-submit{
  width:100%;
  padding:12px;
  background:#a6ff00;
  color:#050505;
  border-radius:11px;
  font-weight:900;
}

.note{
  padding:15px 0;
  border-bottom:1px solid #1c1c1c;
}

.note:last-child{
  border-bottom:none;
}

.note-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.note-subject{
  color:#a6ff00;
  font-size:11px;
  font-weight:800;
}

.note-delete{
  background:none;
  color:#555;
  font-size:17px;
}

.note-title{
  margin-top:7px;
  font-size:14px;
  font-weight:800;
}

.note-text{
  margin-top:7px;
  color:#aaa;
  font-size:12px;
  line-height:1.55;
}

.note-review{
  margin-top:8px;
  padding:8px 10px;
  background:#151515;
  border-radius:9px;
  color:#777;
  font-size:11px;
}

.note.reviewed .note-title{
  color:#555;
  text-decoration:line-through;
}

.note.reviewed .note-review{
  color:#a6ff00;
}

.review-btn{
  margin-top:9px;
  padding:7px 10px;
  border-radius:8px;
  background:#191919;
  color:#888;
  font-size:11px;
}

.stopwatch{
  text-align:center;
}

.stopwatch-title{
  color:#777;
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
}

.stopwatch-time{
  margin:15px 0 18px;
  font-size:52px;
  font-weight:900;
  letter-spacing:2px;
  font-variant-numeric:tabular-nums;
}

.stopwatch-buttons{
  display:flex;
  gap:7px;
}

.stopwatch-buttons button{
  flex:1;
  padding:12px;
  border-radius:12px;
  background:#191919;
  color:#fff;
}

.stopwatch-buttons .start{
  background:#a6ff00;
  color:#000;
  font-weight:900;
}

.study-time{
  margin-top:13px;
  color:#666;
  font-size:11px;
}

.tira{
  background:
    radial-gradient(circle at 90% 0%,rgba(166,255,0,.08),transparent 35%),
    #0d0d0d;
}

.chat{
  min-height:100px;
  max-height:250px;
  overflow-y:auto;
  margin-bottom:10px;
}

.message{
  max-width:88%;
  padding:10px 12px;
  border-radius:12px;
  margin-bottom:7px;
  font-size:13px;
  line-height:1.5;
  white-space:pre-line;
}

.message.bot{
  background:#171717;
}

.message.user{
  background:#a6ff00;
  color:#000;
  margin-left:auto;
}

.chat-row{
  display:flex;
  gap:6px;
}

.chat-row input{
  flex:1;
}

/* SETTINGS */

.subject-manage{
  display:flex;
  gap:7px;
  margin-bottom:8px;
}

.subject-manage input{
  flex:1;
}

.subject-item{
  display:flex;
  align-items:center;
  gap:7px;
  padding:10px 0;
  border-bottom:1px solid #1b1b1b;
}

.subject-item:last-child{
  border-bottom:none;
}

.subject-item input{
  flex:1;
}

.subject-item button{
  background:#191919;
  color:#777;
  border-radius:8px;
  padding:8px 10px;
}

.subject-item .delete-subject{
  color:#ff6666;
}

.total-weight{
  margin-top:12px;
  padding:10px;
  border-radius:10px;
  background:#151515;
  text-align:center;
  font-size:12px;
  color:#777;
}

.total-weight strong{
  color:#a6ff00;
}

.reset{
  width:100%;
  padding:12px;
  border-radius:12px;
  background:#151515;
  color:#666;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">
    HYORA <span>STUDY</span>
  </div>
  <div class="date" id="date"></div>
</header>


<div class="card hero">

  <div class="greeting">
    TODAY'S STUDY
  </div>

  <div class="big-title">
    오늘도 <span class="accent">끝까지.</span>
  </div>

  <div class="progress-info">
    <span>시험기간 전체 진행률</span>
    <strong id="overallPercent">0%</strong>
  </div>

  <div class="progress">
    <div class="progress-bar" id="overallBar"></div>
  </div>

</div>


<div class="tabs">

  <button class="tab active" data-tab="today">
    오늘
  </button>

  <button class="tab" data-tab="week">
    주간
  </button>

  <button class="tab" data-tab="exam">
    시험기간
  </button>

  <button class="tab" data-tab="mistakes">
    오답노트
  </button>

  <button class="tab" data-tab="settings">
    설정
  </button>

</div>


<!-- TODAY -->

<section class="section active" id="today">

  <div class="card">

    <div class="card-title">
      오늘 할 일
    </div>

    <div class="add-row">

      <input
        id="todayInput"
        placeholder="오늘 할 일을 추가해줘">

      <select id="todaySubject"></select>

      <button
        class="add-btn"
        onclick="addTask('today')">
        +
      </button>

    </div>

    <div id="todayTasks"></div>

  </div>


  <div class="card">

    <div class="card-title">
      오늘 통계
    </div>

    <div class="stats">

      <div class="stat">
        <strong id="todayDone">0</strong>
        <span>완료</span>
      </div>

      <div class="stat">
        <strong id="todayTotal">0</strong>
        <span>전체</span>
      </div>

      <div class="stat">
        <strong id="todayRate">0%</strong>
        <span>달성률</span>
      </div>

    </div>

  </div>

</section>


<!-- WEEK -->

<section class="section" id="week">

  <div class="card">

    <div class="card-title">
      이번 주에 끝낼 공부
    </div>

    <div class="add-row">

      <input
        id="weekInput"
        placeholder="이번 주 공부 추가">

      <select id="weekSubject"></select>

      <button
        class="add-btn"
        onclick="addTask('week')">
        +
      </button>

    </div>

    <div id="weekTasks"></div>

  </div>

</section>


<!-- EXAM -->

<section class="section" id="exam">

  <div class="card">

    <div class="card-title">
      시험기간
    </div>

    <div class="exam-grid">

      <div>

        <label>시작일</label>

        <input
          type="date"
          id="examStart">

      </div>

      <div>

        <label>시험일</label>

        <input
          type="date"
          id="examEnd">

      </div>

    </div>

    <button
      class="add-btn save-exam"
      onclick="saveExamDate()">
      시험기간 저장
    </button>

  </div>


  <div class="card">

    <div class="card-title">
      시험일까지 끝낼 공부
    </div>

    <div class="add-row">

      <input
        id="examInput"
        placeholder="시험 전까지 끝낼 공부">

      <select id="examSubject"></select>

      <button
        class="add-btn"
        onclick="addTask('exam')">
        +
      </button>

    </div>

    <div id="examTasks"></div>

  </div>


  <div class="card">

    <div class="card-title">
      과목별 비중
    </div>

    <div id="weights"></div>

  </div>

</section>


<!-- MISTAKES -->

<section class="section" id="mistakes">

  <div class="card">

    <div class="card-title">
      오답노트 추가
    </div>

    <div class="note-form">

      <select id="noteSubject"></select>

      <input
        id="noteTitle"
        placeholder="문제 / 단원 / 오답 제목">

      <textarea
        id="noteReason"
        placeholder="왜 틀렸는지 적어줘"></textarea>

      <textarea
        id="notePoint"
        placeholder="다음에 기억할 점"></textarea>

      <button
        class="note-submit"
        onclick="addNote()">
        오답 저장
      </button>

    </div>

  </div>


  <div class="card">

    <div class="card-title">
      내 오답노트
    </div>

    <div id="notes"></div>

  </div>


  <div class="card">

    <div class="card-title">
      과목별 오답
    </div>

    <div class="stats" id="mistakeStats"></div>

  </div>

</section>


<!-- SETTINGS -->

<section class="section" id="settings">

  <div class="card">

    <div class="card-title">
      과목 설정
    </div>

    <div class="subject-manage">

      <input
        id="newSubject"
        placeholder="예: 기술가정">

      <button
        class="add-btn"
        onclick="addSubject()">
        + 추가
      </button>

    </div>

    <div id="subjectList"></div>

  </div>


  <div class="card">

    <div class="card-title">
      과목별 시험 비중
    </div>

    <div id="settingsWeights"></div>

    <div class="total-weight">
      현재 비중 합계:
      <strong id="totalWeight">
        0%
      </strong>
    </div>

  </div>

</section>


<!-- STOPWATCH -->

<div class="card stopwatch">

  <div class="stopwatch-title">
    STUDY STOPWATCH
  </div>

  <div class="stopwatch-time" id="stopwatch">
    00:00:00
  </div>

  <div class="stopwatch-buttons">

    <button onclick="resetStopwatch()">
      리셋
    </button>

    <button
      class="start"
      id="stopwatchButton"
      onclick="toggleStopwatch()">
      시작
    </button>

  </div>

  <div class="study-time">
    공부시간:
    <span id="totalStudyTime">
      00:00:00
    </span>
  </div>

</div>


<!-- TIRA -->

<div class="card tira">

  <div class="card-title">
    ✦ 티라
  </div>

  <div class="chat" id="chat">

    <div class="message bot">
      안녕 효라! 👋
      오늘 공부 계획이나 시험기간 진행률,
      오답노트에 대해 물어봐!
    </div>

  </div>

  <div class="chat-row">

    <input
      id="tiraInput"
      placeholder="티라에게 물어보기">

    <button
      class="add-btn"
      onclick="askTira()">
      전송
    </button>

  </div>

</div>


<div class="card">

  <button
    class="reset"
    onclick="resetAll()">
    전체 데이터 초기화
  </button>

</div>

</div>


<script>

/* =========================
   DATA
========================= */

let data =
JSON.parse(
  localStorage.getItem("hyoraStudy")
) || {

  today:[],
  week:[],
  exam:[],
  mistakes:[],

  subjects:[
    "국어",
    "영어",
    "수학",
    "과학",
    "사회"
  ],

  weights:{
    국어:20,
    영어:20,
    수학:20,
    과학:20,
    사회:20
  },

  examStart:"",
  examEnd:""

};


/* =========================
   OLD DATA COMPATIBILITY
========================= */

if(!Array.isArray(data.subjects)){
  data.subjects=[
    "국어",
    "영어",
    "수학",
    "과학",
    "사회"
  ];
}

if(!data.weights){
  data.weights={};
}

data.subjects.forEach(subject=>{
  if(
    typeof data.weights[subject] !== "number"
  ){
    data.weights[subject]=0;
  }
});

if(!Array.isArray(data.today)){
  data.today=[];
}

if(!Array.isArray(data.week)){
  data.week=[];
}

if(!Array.isArray(data.exam)){
  data.exam=[];
}

if(!Array.isArray(data.mistakes)){
  data.mistakes=[];
}


/* =========================
   SAVE
========================= */

function saveData(){

  localStorage.setItem(
    "hyoraStudy",
    JSON.stringify(data)
  );

}


/* =========================
   DATE
========================= */

function updateDate(){

  const now=new Date();

  const y=now.getFullYear();

  const m=String(
    now.getMonth()+1
  ).padStart(2,"0");

  const d=String(
    now.getDate()
  ).padStart(2,"0");

  document.getElementById(
    "date"
  ).textContent=
    `${y}.${m}.${d}`;

}

updateDate();


/* =========================
   TABS
========================= */

document
.querySelectorAll(".tab")
.forEach(button=>{

  button.addEventListener(
    "click",
    function(){

      document
      .querySelectorAll(".tab")
      .forEach(tab=>{
        tab.classList.remove("active");
      });

      document
      .querySelectorAll(".section")
      .forEach(section=>{
        section.classList.remove("active");
      });

      this.classList.add("active");

      document
      .getElementById(
        this.dataset.tab
      )
      .classList.add("active");

    }
  );

});


/* =========================
   SUBJECT SELECTS
========================= */

function renderSubjectSelects(){

  const selects=[
    "todaySubject",
    "weekSubject",
    "examSubject",
    "noteSubject"
  ];

  selects.forEach(id=>{

    const select=
      document.getElementById(id);

    if(!select)return;

    const current=
      select.value;

    select.innerHTML=
      data.subjects
      .map(subject=>`
        <option value="${escapeHTML(subject)}">
          ${escapeHTML(subject)}
        </option>
      `)
      .join("");

    if(
      data.subjects.includes(current)
    ){
      select.value=current;
    }

  });

}


/* =========================
   ADD SUBJECT
========================= */

function addSubject(){

  const input=
    document.getElementById(
      "newSubject"
    );

  const name=
    input.value.trim();

  if(!name){
    alert("과목 이름을 입력해줘!");
    return;
  }

  if(
    data.subjects.includes(name)
  ){
    alert("이미 있는 과목이야!");
    return;
  }

  data.subjects.push(name);

  data.weights[name]=0;

  input.value="";

  saveData();

  render();

}


/* =========================
   DELETE SUBJECT
========================= */

function deleteSubject(name){

  if(
    data.subjects.length<=1
  ){
    alert("과목은 최소 1개가 있어야 해!");
    return;
  }

  const used =
    [
      ...data.today,
      ...data.week,
      ...data.exam,
      ...data.mistakes
    ].some(
      item=>item.subject===name
    );

  if(used){

    const ok=
      confirm(
        `"${name}" 과목을 삭제하면 이 과목으로 저장된 계획과 오답의 과목 표시가 사라질 수 있어. 그래도 삭제할까?`
      );

    if(!ok)return;

  }

  data.subjects=
    data.subjects.filter(
      subject=>subject!==name
    );

  delete data.weights[name];

  saveData();

  render();

}


/* =========================
   RENAME SUBJECT
========================= */

function renameSubject(
  oldName,
  newName
){

  newName=newName.trim();

  if(!newName){
    alert("과목 이름을 입력해줘!");
    return;
  }

  if(
    oldName!==newName &&
    data.subjects.includes(newName)
  ){
    alert("이미 있는 과목이야!");
    return;
  }

  const index=
    data.subjects.indexOf(
      oldName
    );

  if(index===-1)return;

  data.subjects[index]=newName;

  data.weights[newName]=
    data.weights[oldName] || 0;

  delete data.weights[oldName];

  [
    ...data.today,
    ...data.week,
    ...data.exam,
    ...data.mistakes
  ].forEach(item=>{

    if(
      item.subject===oldName
    ){
      item.subject=newName;
    }

  });

  saveData();

  render();

}


/* =========================
   SUBJECT LIST
========================= */

function renderSubjectList(){

  const box=
    document.getElementById(
      "subjectList"
    );

  if(!data.subjects.length){

    box.innerHTML=`
      <div class="empty">
        아직 과목이 없어.
      </div>

  }

  box.innerHTML=
    data.subjects
    .map(subject=>`

      <div class="subject-item">

        <input
          value="${escapeHTML(subject)}"

        >

            renameSubject(

              ).value
            )

          수정
        </button>

        <button
          class="delete-subject"
          onclick="
            deleteSubject(
              '${escapeJS(subject)}'
            )
          "
        >
          삭제
        </button>

      </div>

    `)
    .join("");

}


/* =========================
   TASK ADD
========================= */

function addTask(type){

  const input=
    document.getElementById(
      type+"Input"
    );

  const subject=
    document.getElementById(
      type+"Subject"
    ).value;

  const text=
    input.value.trim();

  if(!text)return;

  data[type].push({

    id:Date.now(),

    text:text,

    subject:subject,

    done:false

  });

  input.value="";

  saveData();

  render();

}


/* =========================
   TASK TOGGLE
========================= */

function toggleTask(
  type,
  id
){

  const task=
    data[type].find(
      item=>item.id===id
    );

  if(!task)return;

  task.done=!task.done;

  saveData();

  render();

}


/* =========================
   TASK DELETE
========================= */

function deleteTask(
  type,
  id
){

  data[type]=
    data[type].filter(
      item=>item.id!==id
    );

  saveData();

  render();

}


/* =========================
   TASK RENDER
========================= */

function renderTasks(
  type,
  elementId
){

  const box=
    document.getElementById(
      elementId
    );

  const tasks=
    data[type];

  if(!tasks.length){

    box.innerHTML=`
      <div class="empty">
        아직 계획이 없어!<br>
        위에서 직접 추가해봐 ✦
      </div>
    `;

    return;

  }

  box.innerHTML=
    tasks.map(task=>`

      <div class="task ${
        task.done?"done":""
      }">

        <div
          class="check"
          onclick="
            toggleTask(
              '${type}',
              ${task.id}
            )
          "
        >
          ${task.done?"✓":""}
        </div>

        <div
          class="task-main"
          onclick="
            toggleTask(
              '${type}',
              ${task.id}
            )
          "
        >

          <div class="task-text">
            ${escapeHTML(task.text)}
          </div>

          <div class="task-meta">
            ${escapeHTML(task.subject)}
          </div>

        </div>

        <button
          class="delete"
          onclick="
            deleteTask(
              '${type}',
              ${task.id}
            )
          "
        >
          ×
        </button>

      </div>

    `).join("");

}


/* =========================
   TODAY STATS
========================= */

function renderTodayStats(){

  const total=
    data.today.length;

  const done=
    data.today.filter(
      task=>task.done
    ).length;

  document.getElementById(
    "todayDone"
  ).textContent=done;

  document.getElementById(
    "todayTotal"
  ).textContent=total;

  document.getElementById(
    "todayRate"
  ).textContent=
    total
      ? Math.round(
          done/total*100
        )+"%"
      :"0%";

}


/* =========================
   EXAM PROGRESS
========================= */

function getExamProgress(){

  const total=
    data.exam.length;

  if(!total)return 0;

  const done=
    data.exam.filter(
      task=>task.done
    ).length;

  return Math.round(
    done/total*100
  );

}


function renderProgress(){

  const percent=
    getExamProgress();

  document.getElementById(
    "overallPercent"
  ).textContent=
    percent+"%";

  document.getElementById(
    "overallBar"
  ).style.width=
    percent+"%";

}


/* =========================
   WEIGHTS
========================= */

function renderWeights(){

  const box=
    document.getElementById(
      "weights"
    );

  box.innerHTML=
    data.subjects
    .map(subject=>{

      const value=
        data.weights[subject]||0;

      return `

        <div class="subject-row">

          <div class="subject-name">
            ${escapeHTML(subject)}
          </div>

          <input
            type="number"
            min="0"
            max="100"
            value="${value}"
            onchange="
              changeWeight(
                '${escapeJS(subject)}',
                this.value
              )
            "
          >

          <div class="weight-line">
            <i
              style="width:${Math.min(
                100,
                Math.max(0,value)
              )}%"
            ></i>
          </div>

        </div>

      `;

    })
    .join("");

}


function renderSettingsWeights(){

  const box=
    document.getElementById(
      "settingsWeights"
    );

  box.innerHTML=
    data.subjects
    .map(subject=>{

      const value=
        data.weights[subject]||0;

      return `

        <div class="subject-row">

          <div class="subject-name">
            ${escapeHTML(subject)}
          </div>

          <input
            type="number"
            min="0"
            max="100"
            value="${value}"
            onchange="
              changeWeight(
                '${escapeJS(subject)}',
                this.value
              )
            "
          >

          <div class="weight-line">
            <i
              style="width:${Math.min(
                100,
                Math.max(0,value)
              )}%"
            ></i>
          </div>

        </div>

      `;

    })
    .join("");

  const total=
    data.subjects.reduce(
      (sum,subject)=>
        sum+(Number(
          data.weights[subject]
        )||0),
      0
    );

  document.getElementById(
    "totalWeight"
  ).textContent=
    total+"%";

}


function changeWeight(
  subject,
  value
){

  let number=
    Number(value);

  if(Number.isNaN(number)){
    number=0;
  }

  number=
    Math.max(
      0,
      Math.min(
        100,
        number
      )
    );

  data.weights[subject]=
    number;

  saveData();

  render();

}

   EXAM DATE

/* =========================
   MISTAKE NOTE
========================= */

function addNote(){

  const subject=
    document.getElementById(
      "noteSubject"
    ).value;

  const title=
    document.getElementById(
      "noteTitle"
    ).value.trim();

  const reason=
    document.getElementById(
      "noteReason"
    ).value.trim();

  const point=
    document.getElementById(
      "notePoint"
    ).value.trim();

  if(!title){

    alert(
      "오답 제목을 입력해줘!"
    );

    return;

  }

  data.mistakes.unshift({

    id:Date.now(),

    subject,

    title,

    reason,

    point,

    reviewed:false

  });

  document.getElementById(
    "noteTitle"
  ).value="";

  document.getElementById(
    "noteReason"
  ).value="";

  document.getElementById(
    "notePoint"
  ).value="";

  saveData();

  renderNotes();

}


function toggleNote(id){

  const note=
    data.mistakes.find(
      item=>item.id===id
    );

  if(!note)return;

  note.reviewed=
    !note.reviewed;

  saveData();

  renderNotes();

}


function deleteNote(id){

  data.mistakes=
    data.mistakes.filter(
      note=>note.id!==id
    );

  saveData();

  renderNotes();

}


function renderNotes(){

  const box=
    document.getElementById(
      "notes"
    );

  if(!data.mistakes.length){

    box.innerHTML=`
      <div class="empty">
        아직 오답이 없어!<br>
        틀린 문제를 하나씩 기록해보자 📕
      </div>
    `;

  }else{

    box.innerHTML=
      data.mistakes
      .map(note=>`

        <div class="note ${
          note.reviewed?"reviewed":""
        }">

          <div class="note-head">

            <div class="note-subject">
              ${escapeHTML(note.subject)}
            </div>

            <button
              class="note-delete"
              onclick="
                deleteNote(
                  ${note.id}
                )
              "
            >
              ×
            </button>

          </div>

          <div class="note-title">
            ${escapeHTML(note.title)}
          </div>

          ${
            note.reason
            ?`
              <div class="note-text">
                <b>틀린 이유</b><br>
                ${escapeHTML(note.reason)}
              </div>
            `
            :""
          }

          ${
            note.point
            ?`
              <div class="note-review">
                <b>기억할 점</b><br>
                ${escapeHTML(note.point)}
              </div>
            `
            :""
          }

          <button
            class="review-btn"
            onclick="
              toggleNote(
                ${note.id}
              )
            "
          >
            ${
              note.reviewed
              ?"✓ 복습 완료"
              :"복습 완료 체크"
            }
          </button>

        </div>

      `)
      .join("");

  }

  renderMistakeStats();

}


function renderMistakeStats(){

  const box=
    document.getElementById(
      "mistakeStats"
    );

  box.innerHTML=
    data.subjects
    .map(subject=>{

      const count=
        data.mistakes.filter(
          note=>
            note.subject===subject
        ).length;

      return `

        <div class="stat">

          <strong>
            ${count}
          </strong>

          <span>
            ${escapeHTML(subject)}
          </span>

        </div>

      `;

    })
    .join("");

}


/* =========================
   STOPWATCH
========================= */

let stopwatchSeconds=
  Number(
    localStorage.getItem(
      "hyoraStopwatch"
    )
  )||0;

let stopwatchRunning=false;

let stopwatchInterval=null;


function formatTime(seconds){

  const hours=
    Math.floor(
      seconds/3600
    );

  const minutes=
    Math.floor(
      (seconds%3600)/60
    );

  const secs=
    seconds%60;

  return [
    String(hours).padStart(2,"0"),
    String(minutes).padStart(2,"0"),
    String(secs).padStart(2,"0")
  ].join(":");

}


function renderStopwatch(){

  document.getElementById(
    "stopwatch"
  ).textContent=
    formatTime(
      stopwatchSeconds
    );

  document.getElementById(
    "totalStudyTime"
  ).textContent=
    formatTime(
      stopwatchSeconds
    );

}


function toggleStopwatch(){

  if(stopwatchRunning){

    stopStopwatch();

  }else{

    startStopwatch();

  }

}


function startStopwatch(){

  if(stopwatchRunning)return;

  stopwatchRunning=true;

  document.getElementById(
    "stopwatchButton"
  ).textContent=
    "일시정지";

  stopwatchInterval=
    setInterval(()=>{

      stopwatchSeconds++;

      localStorage.setItem(
        "hyoraStopwatch",
        stopwatchSeconds
      );

      renderStopwatch();

    },1000);

}


function stopStopwatch(){

  stopwatchRunning=false;

  clearInterval(
    stopwatchInterval
  );

  stopwatchInterval=null;

  document.getElementById(
    "stopwatchButton"
  ).textContent=
    "시작";

}


function resetStopwatch(){

  stopStopwatch();

  stopwatchSeconds=0;

  localStorage.setItem(
    "hyoraStopwatch",
    "0"
  );

  renderStopwatch();

}


/* =========================
   TIRA
========================= */

function askTira(){

  const input=
    document.getElementById(
      "tiraInput"
    );

  const text=
    input.value.trim();

  if(!text)return;

  addChat(
    text,
    "user"
  );

  input.value="";

  setTimeout(()=>{

    addChat(
      getTiraReply(text),
      "bot"
    );

  },200);

}


function addChat(
  text,
  type
){

  const chat=
    document.getElementById(
      "chat"
    );

  const message=
    document.createElement(
      "div"
    );

  message.className=
    "message "+type;

  message.textContent=
    text;

  chat.appendChild(
    message
  );

  chat.scrollTop=
    chat.scrollHeight;

}


function getTiraReply(text){

  const progress=
    getExamProgress();

  const examTotal=
    data.exam.length;

  const examDone=
    data.exam.filter(
      task=>task.done
    ).length;

  const mistakeCount=
    data.mistakes.length;


  if(
    text.includes("진행률")||
    text.includes("퍼센트")||
    text.includes("몇 프로")
  ){

    return `
시험기간 전체 진행률은
${progress}%야!

${examDone}/${examTotal}개 완료했어.
    `.trim();

  }


  if(
    text.includes("오답")||
    text.includes("틀린")
  ){

    return `
현재 오답노트에는
${mistakeCount}개의 오답이 있어.

복습 완료도 하나씩 늘려보자 📕
    `.trim();

  }


  if(
    text.includes("오늘")||
    text.includes("할 일")
  ){

    const total=
      data.today.length;

    const done=
      data.today.filter(
        task=>task.done
      ).length;

    return `
오늘은 ${total}개 중
${done}개 완료했어!

남은 건
${total-done}개야.
    `.trim();

  }


  if(
    text.includes("과목")
  ){

    return `
지금 설정된 과목은

${data.subjects.join(" · ")}

이야!

설정 탭에서
직접 추가하거나 수정할 수 있어 ✦
    `.trim();

  }


  return `
응! ✦

현재 시험기간 진행률은
${progress}%이고,

오답노트에는
${mistakeCount}개가 있어.

하나씩 끝내보자!
  `.trim();

}


/* =========================
   ESCAPE
========================= */

function escapeHTML(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJS(text){

  return String(text)
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =========================
   RESET
========================= */

function resetAll(){

  const confirmed=
    confirm(
      "정말 모든 공부 데이터를 삭제할까?"
    );

  if(!confirmed)return;

  localStorage.removeItem(
    "hyoraStudy"
  );

  localStorage.removeItem(
    "hyoraStopwatch"
  );

  location.reload();

}


/* =========================
   RENDER ALL
========================= */

function render(){

  renderSubjectSelects();

  renderSubjectList();

  renderTasks(
    "today",
    "todayTasks"
  );

  renderTasks(
    "week",
    "weekTasks"
  );

  renderTasks(
    "exam",
    "examTasks"
  );

  renderTodayStats();

  renderProgress();

  renderWeights();

  renderSettingsWeights();

  renderNotes();

  loadExamDate();

  renderStopwatch();

}


/* =========================
   START
========================= */

render();

</script>
